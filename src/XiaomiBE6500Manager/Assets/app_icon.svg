<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#F25A00"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDE2EA"/>
    </linearGradient>
    <linearGradient id="ant" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9CFDA"/>
      <stop offset="0.5" stop-color="#F4F6F9"/>
      <stop offset="1" stop-color="#C9CFDA"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Wi-Fi arcs -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-opacity="0.9">
    <path d="M196 112a84 84 0 0 1 120 0" stroke-width="16"/>
    <path d="M222 140a46 46 0 0 1 68 0" stroke-width="16"/>
    <circle cx="256" cy="168" r="9" fill="#FFFFFF" stroke="none"/>
  </g>
  <!-- Antennas -->
  <g>
    <rect x="118" y="196" width="30" height="150" rx="15" fill="url(#ant)"/>
    <rect x="186" y="214" width="30" height="132" rx="15" fill="url(#ant)"/>
    <rect x="296" y="214" width="30" height="132" rx="15" fill="url(#ant)"/>
    <rect x="364" y="196" width="30" height="150" rx="15" fill="url(#ant)"/>
  </g>
  <!-- Ground shadow -->
  <ellipse cx="256" cy="438" rx="168" ry="14" fill="#7A2B00" fill-opacity="0.28"/>
  <!-- Router body -->
  <rect x="72" y="318" width="368" height="112" rx="30" fill="url(#body)"/>
  <rect x="72" y="318" width="368" height="112" rx="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2"/>
  <!-- Front panel: status LEDs and port slots -->
  <circle cx="132" cy="374" r="9" fill="#FF6900"/>
  <circle cx="164" cy="374" r="9" fill="#2EC27E"/>
  <circle cx="196" cy="374" r="9" fill="#2EC27E"/>
  <rect x="246" y="364" width="40" height="20" rx="5" fill="#B7BFCC"/>
  <rect x="294" y="364" width="40" height="20" rx="5" fill="#B7BFCC"/>
  <rect x="342" y="364" width="40" height="20" rx="5" fill="#B7BFCC"/>
</svg>
